name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Reviewed commit SHA to build and deploy"
        required: true
        type: string
      catalog_as_of:
        description: "Catalog rights review date (YYYY-MM-DD)"
        required: true
        type: string
      expected_tokyo_catalog_version:
        description: "Expected active Tokyo catalog version; empty only for first publish"
        required: false
        default: ""
        type: string
      expected_seoul_catalog_version:
        description: "Expected active Seoul catalog version; empty only for first publish"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
      - name: Install and verify
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:e2e
          pnpm build
          pnpm catalog:validate --production --as-of "${{ inputs.catalog_as_of }}"
          pnpm release:verify:test
          pnpm audit --audit-level high
      - name: Package immutable release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          pnpm catalog:build -- \
            --production \
            --as-of "${{ inputs.catalog_as_of }}" \
            --catalog-version "catalog-${{ inputs.release_sha }}" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output release/catalog-projection.json
          pnpm --filter @route-composer/api deploy --prod release/lambda
          (cd release/lambda && zip -qr ../lambda.zip .)
          mkdir -p release/web
          cp -R apps/web/dist/. release/web/
          (cd release && sha256sum lambda.zip catalog-projection.json > SHA256SUMS)
          openssl dgst -sha256 -binary release/lambda.zip | base64 -w0 > release/lambda-source-code-hash.txt
          printf '%s\n' "${{ inputs.release_sha }}" > release/release-sha.txt
          docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:0.58.2 \
            fs --format cyclonedx --output /workspace/release/sbom.json /workspace/release/lambda
          node scripts/release-verify.mjs \
            --release-dir release \
            --release-sha "${{ inputs.release_sha }}"
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.release_sha }}
          path: release
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event.repository.fork == false
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
      - name: Download immutable release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ inputs.release_sha }}
          path: release
      - name: Verify artifact identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs \
            --release-dir release \
            --release-sha "${{ inputs.release_sha }}"
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Upload Lambda artifact to managed bucket
        shell: bash
        run: |
          set -euo pipefail
          lambda_key="${{ inputs.release_sha }}/lambda.zip"
          aws s3 cp release/lambda.zip "s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/${lambda_key}" \
            --sse AES256 --only-show-errors
          printf '%s\n' "$lambda_key" > release/lambda-s3-key.txt
      - name: Fresh Terraform plan and apply
        shell: bash
        run: |
          set -euo pipefail
          lambda_hash="$(cat release/lambda-source-code-hash.txt)"
          lambda_key="$(cat release/lambda-s3-key.txt)"
          docker_args=(
            --rm
            -e AWS_ACCESS_KEY_ID
            -e AWS_SECRET_ACCESS_KEY
            -e AWS_SESSION_TOKEN
            -e AWS_REGION
            -e AWS_DEFAULT_REGION
            -v "$PWD:/workspace"
            -w /workspace
          )
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production plan -input=false -lock-timeout=60s \
            -out=/workspace/release/tfplan \
            -var="project_slug=${{ vars.PROJECT_SLUG }}" \
            -var="budget_email=${{ secrets.BUDGET_EMAIL }}" \
            -var="lambda_s3_bucket=${{ vars.LAMBDA_ARTIFACT_BUCKET }}" \
            -var="lambda_s3_key=${lambda_key}" \
            -var="lambda_source_code_hash=${lambda_hash}" \
            -var="release_sha=${{ inputs.release_sha }}"
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production apply -input=false -auto-approve /workspace/release/tfplan
      - name: Publish immutable Catalog projection
        shell: bash
        run: |
          set -euo pipefail
          catalog_table="$(docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production output -raw catalog_table_name)"
          node release/lambda/dist/infrastructure/catalog-publisher-cli.js \
            --table-name "$catalog_table" \
            --artifact release/catalog-projection.json \
            --checked-at "${{ inputs.catalog_as_of }}" \
            --expected-tokyo-version "${{ inputs.expected_tokyo_catalog_version }}" \
            --expected-seoul-version "${{ inputs.expected_seoul_catalog_version }}"
      - name: Publish Web artifact after API is known
        shell: bash
        run: |
          set -euo pipefail
          docker_args=(
            --rm
            -e AWS_ACCESS_KEY_ID
            -e AWS_SECRET_ACCESS_KEY
            -e AWS_SESSION_TOKEN
            -e AWS_REGION
            -e AWS_DEFAULT_REGION
            -v "$PWD:/workspace"
            -w /workspace
          )
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production output -raw web_bucket_name > release/web-bucket.txt
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production output -raw cloudfront_distribution_id > release/cloudfront-id.txt
          docker run "${docker_args[@]}" hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production output -raw api_endpoint > release/api-endpoint.txt
          web_bucket="$(cat release/web-bucket.txt)"
          cloudfront_id="$(cat release/cloudfront-id.txt)"
          api_endpoint="$(cat release/api-endpoint.txt)"
          printf 'window.__ROUTE_COMPOSER_CONFIG__ = { apiBaseUrl: "%s" };\n' "$api_endpoint" > release/web/config.js
          aws s3 sync release/web "s3://${web_bucket}" --delete \
            --exclude config.js --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp release/web/config.js "s3://${web_bucket}/config.js" \
            --cache-control "no-store" --content-type "application/javascript"
          aws s3 cp release/web/index.html "s3://${web_bucket}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "$cloudfront_id" --paths /index.html /config.js
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          api_endpoint="$(cat release/api-endpoint.txt)"
          cloudfront_id="$(cat release/cloudfront-id.txt)"
          web_domain="$(aws cloudfront get-distribution --id "$cloudfront_id" --query 'Distribution.DomainName' --output text)"
          curl --fail --silent --show-error "${api_endpoint}/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error "https://${web_domain}/" | grep -q '한일 여행 동선 조합기'
