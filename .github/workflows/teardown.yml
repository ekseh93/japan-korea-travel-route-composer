name: Teardown Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY-PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    if: inputs.confirmation == 'DESTROY-PRODUCTION' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    environment:
      name: production-teardown
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Verify approved teardown inputs
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          LAMBDA_ARTIFACT_KEY: ${{ vars.LAMBDA_ARTIFACT_KEY }}
          LAMBDA_SOURCE_CODE_HASH: ${{ vars.LAMBDA_SOURCE_CODE_HASH }}
        run: |
          set -euo pipefail
          if [[ -z "$BUDGET_EMAIL" ]]; then
            echo "::error::BUDGET_EMAIL is not approved or configured; refusing teardown."
            exit 1
          fi
          if [[ ! "$MONTHLY_BUDGET_USD" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "::error::MONTHLY_BUDGET_USD must be an explicitly approved integer from 1 to 100; refusing teardown."
            exit 1
          fi
          if [[ ! "$LAMBDA_ARTIFACT_KEY" =~ ^[0-9a-f]{40}/lambda\.zip$ ]]; then
            echo "::error::LAMBDA_ARTIFACT_KEY must be a 40-character release SHA followed by /lambda.zip; refusing teardown."
            exit 1
          fi
          if [[ ! "$LAMBDA_SOURCE_CODE_HASH" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::LAMBDA_SOURCE_CODE_HASH must be a Base64 SHA-256 digest; refusing teardown."
            exit 1
          fi
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: teardown-${{ github.run_id }}
      - name: Destroy application stack only
        run: |
          echo "Bootstrap state bucket is intentionally outside this destroy target."
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.10.5 \
            -chdir=infra/environments/production init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.10.5 \
            -chdir=infra/environments/production destroy -input=false -auto-approve \
            -var="project_slug=${{ vars.PROJECT_SLUG }}" \
            -var="budget_email=${{ secrets.BUDGET_EMAIL }}" \
            -var="monthly_budget_usd=${{ vars.MONTHLY_BUDGET_USD }}" \
            -var="lambda_s3_bucket=${{ vars.LAMBDA_ARTIFACT_BUCKET }}" \
            -var="lambda_s3_key=${{ vars.LAMBDA_ARTIFACT_KEY }}" \
            -var="lambda_source_code_hash=${{ vars.LAMBDA_SOURCE_CODE_HASH }}"
