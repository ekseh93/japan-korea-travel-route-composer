name: Teardown Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY-PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    if: inputs.confirmation == 'DESTROY-PRODUCTION' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    environment:
      name: production-teardown
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: teardown-${{ github.run_id }}
      - name: Destroy application stack only
        run: |
          echo "Bootstrap state bucket is intentionally outside this destroy target."
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production destroy -input=false -auto-approve \
            -var="project_slug=${{ vars.PROJECT_SLUG }}" \
            -var="budget_email=${{ secrets.BUDGET_EMAIL }}" \
            -var="lambda_s3_bucket=${{ vars.LAMBDA_ARTIFACT_BUCKET }}" \
            -var="lambda_s3_key=${{ vars.LAMBDA_ARTIFACT_KEY }}" \
            -var="lambda_source_code_hash=${{ vars.LAMBDA_SOURCE_CODE_HASH }}"
