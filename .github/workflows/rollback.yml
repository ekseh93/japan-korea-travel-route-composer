name: Rollback Catalog Production

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: "Reviewed commit containing the rollback CLI"
        required: true
        type: string
      target_tokyo_catalog_version:
        description: "Existing Tokyo CatalogVersion to reactivate"
        required: true
        type: string
      target_seoul_catalog_version:
        description: "Existing Seoul CatalogVersion to reactivate"
        required: true
        type: string
      expected_tokyo_catalog_version:
        description: "Currently active Tokyo CatalogVersion"
        required: true
        type: string
      expected_seoul_catalog_version:
        description: "Currently active Seoul CatalogVersion"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed rollback CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_sha }}
      - name: Install and build rollback CLI
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @route-composer/contracts build
          pnpm --filter @route-composer/api build
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: rollback-${{ github.run_id }}
      - name: Roll back Catalog pointers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production init -input=false
          catalog_table="$(docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production output -raw catalog_table_name)"
          node apps/api/dist/infrastructure/catalog-rollback-cli.js \
            --table-name "$catalog_table" \
            --target-tokyo-version "${{ inputs.target_tokyo_catalog_version }}" \
            --target-seoul-version "${{ inputs.target_seoul_catalog_version }}" \
            --expected-tokyo-version "${{ inputs.expected_tokyo_catalog_version }}" \
            --expected-seoul-version "${{ inputs.expected_seoul_catalog_version }}"
