name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    container: node:24.19.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify runtime
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Catalog rights gate
        run: pnpm catalog:validate
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Smoke contract tests
        run: pnpm smoke:test

  browser-e2e:
    runs-on: ubuntu-24.04
    container: node:24.19.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E and accessibility
        run: pnpm test:e2e

  terraform-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Terraform format
        run: docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 fmt -check -recursive
      - name: Terraform validate
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production init -backend=false -input=false
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/environments/production validate
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/bootstrap init -backend=false -input=false
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.9.8 \
            -chdir=infra/bootstrap validate
      - name: Terraform lint
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/terraform-linters/tflint:v0.55.1 --recursive
      - name: IaC security scan
        run: docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:0.58.2 config --severity HIGH,CRITICAL /workspace/infra
