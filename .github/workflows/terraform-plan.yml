name: Terraform Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: terraform-plan
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Verify approved plan inputs
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          LAMBDA_ARTIFACT_KEY: ${{ vars.LAMBDA_ARTIFACT_KEY }}
          LAMBDA_SOURCE_CODE_HASH: ${{ vars.LAMBDA_SOURCE_CODE_HASH }}
        run: |
          set -euo pipefail
          if [[ -z "$BUDGET_EMAIL" ]]; then
            echo "::error::BUDGET_EMAIL is not approved or configured; refusing AWS Plan."
            exit 1
          fi
          if [[ ! "$MONTHLY_BUDGET_USD" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "::error::MONTHLY_BUDGET_USD must be an explicitly approved integer from 1 to 100; refusing AWS Plan."
            exit 1
          fi
          if [[ -z "$LAMBDA_ARTIFACT_KEY" ]]; then
            echo "::error::LAMBDA_ARTIFACT_KEY is not configured; refusing AWS Plan."
            exit 1
          fi
          if [[ ! "$LAMBDA_ARTIFACT_KEY" =~ ^[0-9a-f]{40}/lambda\.zip$ ]]; then
            echo "::error::LAMBDA_ARTIFACT_KEY must be a 40-character release SHA followed by /lambda.zip; refusing AWS Plan."
            exit 1
          fi
          if [[ -z "$LAMBDA_SOURCE_CODE_HASH" ]]; then
            echo "::error::LAMBDA_SOURCE_CODE_HASH is not configured; refusing AWS Plan."
            exit 1
          fi
          if [[ ! "$LAMBDA_SOURCE_CODE_HASH" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::LAMBDA_SOURCE_CODE_HASH must be a Base64 SHA-256 digest; refusing AWS Plan."
            exit 1
          fi
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-${{ github.run_id }}
      - name: Terraform plan
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.10.5 \
            -chdir=infra/environments/production init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.10.5 \
            -chdir=infra/environments/production plan -input=false -lock-timeout=60s \
            -var="project_slug=${{ vars.PROJECT_SLUG }}" \
            -var="budget_email=${{ secrets.BUDGET_EMAIL }}" \
            -var="monthly_budget_usd=${{ vars.MONTHLY_BUDGET_USD }}" \
            -var="lambda_s3_bucket=${{ vars.LAMBDA_ARTIFACT_BUCKET }}" \
            -var="lambda_s3_key=${{ vars.LAMBDA_ARTIFACT_KEY }}" \
            -var="lambda_source_code_hash=${{ vars.LAMBDA_SOURCE_CODE_HASH }}" \
            -var="manage_lambda_reserved_concurrency=false" \
            -var="release_sha=${{ github.sha }}"
